workflows:
  qreeb-ios:
    name: QREEB - Build iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: QREEB_ios_signing
    environment:
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: "com.qreeb.app"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: latest
      xcode: latest
    scripts:
      - name: Installer les dépendances npm
        script: npm install
      - name: Build web (Vite)
        script: npm run build
      - name: Regenerer la plateforme iOS si absente
        script: |
          set -e
          if [ ! -d "ios/App" ]; then
            rm -rf ios
            npm install @capacitor/ios
            npx cap add ios
          fi
          if [ ! -d "ios/App/App.xcodeproj" ]; then
            echo ">>> ECHEC CRITIQUE : App.xcodeproj introuvable."
            exit 1
          fi
      - name: Changer le Bundle ID iOS uniquement
        script: |
          set -e
          sed -i '' "s/com\.orania\.app/$BUNDLE_ID/g" ios/App/App.xcodeproj/project.pbxproj
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Preparer le trousseau (keychain)
        script: keychain initialize
      - name: Recuperer les fichiers de signature
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
      - name: Ajouter le certificat au trousseau
        script: keychain add-certificates
      - name: Appliquer la signature au projet Xcode
        script: xcode-project use-profiles
      - name: Build iOS (archive)
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - kichounacer2003@gmail.com
