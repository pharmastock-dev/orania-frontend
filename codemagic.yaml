workflows:
  qreeb-ios:
    name: QREEB - Build iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - ios_signing  # créé dans Codemagic : contient les certificats/clés Apple
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Installer les dépendances npm
        script: npm install
      - name: Build web (Vite)
        script: npm run build
      - name: Regenerer la plateforme iOS si le Podfile est absent
        script: |
          set -e
          if [ ! -f "ios/App/Podfile" ]; then
            echo ">>> Podfile absent -- dossier ios probablement incomplet, regeneration complete..."
            rm -rf ios
            npm install @capacitor/ios
            npx cap add ios
          else
            echo ">>> Podfile deja present, rien a faire."
          fi
          echo "=== Verification finale ==="
          if [ -f "ios/App/Podfile" ]; then
            echo ">>> SUCCES : Podfile confirme present."
          else
            echo ">>> ECHEC CRITIQUE : Podfile toujours absent apres regeneration."
            exit 1
          fi
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Installer les pods iOS
        script: |
          cd ios/App && pod install
      - name: Build iOS (archive)
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      # Décommente une fois prêt à envoyer automatiquement vers TestFlight
      # app_store_connect:
      #   auth: integration
      #   submit_to_testflight: true
      email:
        recipients:
          - kichounacer2003@gmail.com
