workflows:
  qreeb-ios:
    name: QREEB - Build iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: QREEB_ios_signing
    environment:
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: "com.qreeb.app"
        APP_STORE_APPLE_ID: "6813695042"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: latest
      xcode: latest
    scripts:
      - name: Installer les dépendances npm
        script: npm install
      - name: Build web (Vite)
        script: npm run build
      - name: Regenerer la plateforme iOS (toujours, jamais reutilisee)
        script: |
          set -e
          echo ">>> Suppression de tout ancien dossier ios (evite le cache/nom fige)..."
          rm -rf ios
          npm install @capacitor/ios
          npx cap add ios
          if [ ! -d "ios/App/App.xcodeproj" ]; then
            echo ">>> ECHEC CRITIQUE : App.xcodeproj introuvable."
            exit 1
          fi
          echo ">>> Verification du nom de l'app dans Info.plist :"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" ios/App/App/Info.plist 2>/dev/null || echo "CFBundleDisplayName absent (utilise CFBundleName)"
      - name: Changer le Bundle ID iOS uniquement
        script: |
          set -e
          sed -i '' "s/com\.orania\.app/$BUNDLE_ID/g" ios/App/App.xcodeproj/project.pbxproj
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Capture d'ecran automatique (simulateur)
        script: |
          set -e
          echo ">>> Simulateurs iPhone disponibles :"
          xcrun simctl list devices available | grep -E "iPhone [0-9]+" || echo "Aucun trouve avec ce filtre"
          SIM_ID=$(xcrun simctl list devices available | grep -E "iPhone [0-9]+" | head -1 | grep -oE '[0-9A-F-]{36}')
          if [ -z "$SIM_ID" ]; then
            echo ">>> Aucun simulateur trouve, capture ignoree (non bloquant)."
          else
            echo ">>> Simulateur trouve : $SIM_ID"
            xcrun simctl boot "$SIM_ID" || true
            xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
              -sdk iphonesimulator -derivedDataPath build_sim \
              -destination "id=$SIM_ID" build
            APP_PATH=$(find build_sim -name "App.app" -path "*iphonesimulator*" | head -1)
            xcrun simctl install "$SIM_ID" "$APP_PATH"
            mkdir -p screenshots
            # Demarre la capture des vrais logs de l'app en arriere-plan,
            # pour diagnostiquer une eventuelle erreur JS/WebView au lancement.
            xcrun simctl spawn "$SIM_ID" log stream --level debug \
              --predicate "process == \"App\"" > screenshots/logs_lancement.txt 2>&1 &
            LOG_PID=$!
            xcrun simctl launch "$SIM_ID" "$BUNDLE_ID"
            echo ">>> Attente 25s pour le chargement complet..."
            sleep 25
            xcrun simctl io "$SIM_ID" screenshot screenshots/qreeb_accueil.png
            kill $LOG_PID 2>/dev/null || true
            echo ">>> Capture enregistree : screenshots/qreeb_accueil.png"
            echo ">>> Logs enregistres : screenshots/logs_lancement.txt"
          fi
      - name: Preparer le trousseau (keychain)
        script: keychain initialize
      - name: Recuperer les fichiers de signature
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
      - name: Ajouter le certificat au trousseau
        script: keychain add-certificates
      - name: Appliquer la signature au projet Xcode
        script: xcode-project use-profiles
      - name: Incrementer le numero de build automatiquement
        script: |
          set -e
          cd ios/App
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          echo ">>> Dernier build TestFlight : $LATEST"
          NOUVEAU=$((LATEST + 1))
          echo ">>> Nouveau numero de build : $NOUVEAU"
          agvtool new-version -all "$NOUVEAU"
      - name: Build iOS (archive)
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - screenshots/*.png
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - kichounacer2003@gmail.com
