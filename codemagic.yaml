workflows:
  qreeb-ios:
    name: QREEB - Build iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - ios_signing  # créé dans Codemagic : contient les certificats/clés Apple
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: latest
      xcode: latest
    scripts:
      - name: Installer les dépendances npm
        script: npm install
      - name: Build web (Vite)
        script: npm run build
      - name: Regenerer la plateforme iOS si absente
        script: |
          set -e
          if [ ! -d "ios/App" ]; then
            echo ">>> Dossier ios/App absent -- ajout de la plateforme iOS..."
            rm -rf ios
            npm install @capacitor/ios
            npx cap add ios
          else
            echo ">>> ios/App deja present, rien a faire."
          fi
          echo "=== Verification finale ==="
          if [ -d "ios/App/App.xcodeproj" ]; then
            echo ">>> SUCCES : projet Xcode confirme present."
          else
            echo ">>> ECHEC CRITIQUE : App.xcodeproj introuvable."
            exit 1
          fi
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      # Plus de pod install -- Capacitor 8.x utilise Swift Package Manager,
      # les dependances se resolvent automatiquement au moment du build.
      - name: Build iOS (archive)
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      # Décommente une fois prêt à envoyer automatiquement vers TestFlight
      # app_store_connect:
      #   auth: integration
      #   submit_to_testflight: true
      email:
        recipients:
          - kichounacer2003@gmail.com
